name: Docker Build & Push

on:
  push:
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/api
  IMAGE_WEB: ${{ github.repository }}/web

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: apps/api
            dockerfile: apps/api/Dockerfile
            image: api
            platforms: linux/amd64,linux/arm64
          - context: apps/web
            dockerfile: apps/web/Dockerfile
            image: web
            platforms: linux/amd64,linux/arm64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=Shomer ${{ matrix.image }}
            org.opencontainers.image.description=Shomer ${{ matrix.image }} service
            org.opencontainers.image.vendor=Shomer
      
      - name: Build and push ${{ matrix.image }} image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
      
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
        continue-on-error: true

  # Create GitHub Release
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate release notes
        id: notes
        run: |
          VERSION=${{ github.ref_name }}
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags $(git rev-list --tags --skip=1 --max-count=1) 2>/dev/null || echo "")
          
          echo "## 🚀 Shomer $VERSION" > release_notes.md
          echo "" >> release_notes.md
          echo "### 📦 Docker Images" >> release_notes.md
          echo "" >> release_notes.md
          echo "Pull the latest images:" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ github.repository }}/api:$VERSION" >> release_notes.md
          echo "docker pull ${{ env.REGISTRY }}/${{ github.repository }}/web:$VERSION" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "### 📝 Changes" >> release_notes.md
          echo "" >> release_notes.md
          
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..${{ github.ref_name }} >> release_notes.md
          else
            echo "Initial release" >> release_notes.md
          fi
          
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "### 🏃 Quick Start" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "# Download docker-compose.yml" >> release_notes.md
          echo "wget https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/infra/docker-compose.yml" >> release_notes.md
          echo "" >> release_notes.md
          echo "# Set image versions" >> release_notes.md
          echo "export IMAGE_TAG=$VERSION" >> release_notes.md
          echo "" >> release_notes.md
          echo "# Start services" >> release_notes.md
          echo "docker compose up -d" >> release_notes.md
          echo '```' >> release_notes.md
          
          cat release_notes.md
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: release_notes.md
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Notify on completion
  notify:
    name: Notify Build Complete
    runs-on: ubuntu-latest
    needs: [build-and-push, release]
    if: always()
    
    steps:
      - name: Build Success
        if: needs.build-and-push.result == 'success'
        run: |
          echo "✅ Docker images built and pushed successfully!"
          echo "Images available at:"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.ref_name }}"
          echo "  - ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.ref_name }}"
      
      - name: Build Failed
        if: needs.build-and-push.result == 'failure'
        run: |
          echo "❌ Docker build failed!"
          exit 1

