name: Security Audit

# Phase 2.5 Hardening: Automated security audits and vulnerability scanning
# Runs daily at 6 AM UTC and can be triggered manually

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"  # Daily at 6 AM UTC

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit on requirements
        working-directory: apps/api
        run: |
          pip-audit -r pyproject.toml --format json --output pip-audit-report.json || true
          pip-audit -r pyproject.toml || echo "Vulnerabilities found (non-blocking)"

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: pip-audit-report
          path: apps/api/pip-audit-report.json
          retention-days: 30

  node-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: ['apps/web', 'packages/shared']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ${{ matrix.directory }}
        run: npm ci

      - name: Run npm audit
        working-directory: ${{ matrix.directory }}
        run: |
          npm audit --json --omit=dev > npm-audit-report.json || true
          npm audit --omit=dev || echo "Vulnerabilities found (non-blocking)"

      - name: Upload npm audit report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: npm-audit-report-${{ matrix.directory }}
          path: ${{ matrix.directory }}/npm-audit-report.json
          retention-days: 30

  container-scan:
    name: Container Image Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (for scanning)
        working-directory: apps/api
        run: docker build -t shomer-api:scan .

      - name: Build Web image (for scanning)
        working-directory: apps/web
        run: docker build -t shomer-web:scan .

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy

      - name: Scan API image with Trivy
        run: |
          trivy image --format json --output trivy-api-report.json shomer-api:scan || true
          trivy image --severity HIGH,CRITICAL shomer-api:scan || echo "Vulnerabilities found (non-blocking)"

      - name: Scan Web image with Trivy
        run: |
          trivy image --format json --output trivy-web-report.json shomer-web:scan || true
          trivy image --severity HIGH,CRITICAL shomer-web:scan || echo "Vulnerabilities found (non-blocking)"

      - name: Upload Trivy reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-api-report.json
            trivy-web-report.json
          retention-days: 30

  sbom-generation:
    name: Generate Software Bill of Materials (SBOM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM for entire repository
        run: |
          syft dir:. -o spdx-json > sbom-repo.json
          syft dir:. -o cyclonedx-json > sbom-repo-cyclonedx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: |
            sbom-repo.json
            sbom-repo-cyclonedx.json
          retention-days: 90

  vulnerability-scan:
    name: Vulnerability Scan with Grype
    runs-on: ubuntu-latest
    needs: sbom-generation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Scan repository for vulnerabilities
        run: |
          grype dir:. --output json --file grype-report.json || true
          grype dir:. --fail-on high || echo "High severity vulnerabilities found (non-blocking)"

      - name: Upload Grype report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: grype-report
          path: grype-report.json
          retention-days: 30

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Install TruffleHog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.63.2/trufflehog_3.63.2_linux_amd64.tar.gz | tar -xz
          chmod +x trufflehog
          sudo mv trufflehog /usr/local/bin/

      - name: Run TruffleHog secret scan
        run: |
          trufflehog filesystem . --json --no-update > trufflehog-report.json || true
          trufflehog filesystem . --no-update || echo "Potential secrets found (non-blocking)"

      - name: Upload TruffleHog report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trufflehog-report
          path: trufflehog-report.json
          retention-days: 30

  security-summary:
    name: Generate Security Summary
    runs-on: ubuntu-latest
    needs: [python-audit, node-audit, container-scan, vulnerability-scan, secret-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate summary
        run: |
          echo "# Security Audit Summary" > security-summary.md
          echo "" >> security-summary.md
          echo "Generated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Audit Components" >> security-summary.md
          echo "- Python dependencies (pip-audit)" >> security-summary.md
          echo "- Node.js dependencies (npm audit)" >> security-summary.md
          echo "- Container images (Trivy)" >> security-summary.md
          echo "- Repository vulnerabilities (Grype)" >> security-summary.md
          echo "- Secret scanning (TruffleHog)" >> security-summary.md
          echo "" >> security-summary.md
          echo "## Artifacts" >> security-summary.md
          echo "Detailed reports are available as workflow artifacts." >> security-summary.md
          cat security-summary.md

      - name: Upload security summary
        uses: actions/upload-artifact@v3
        with:
          name: security-summary
          path: security-summary.md
          retention-days: 90


