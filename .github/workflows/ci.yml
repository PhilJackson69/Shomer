name: ci
on:
  push: { branches: ["main"] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: shomer_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/shomer_test
      NODE_ENV: test
      PYTHONUNBUFFERED: "1"
      MFA_ENFORCE_ADMINS: "true"
      MFA_TEST_MODE: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install system libs
        run: |
          sudo apt-get update
          # Common needs for webauthn/fido/crypto/png
          sudo apt-get install -y libudev-dev libusb-1.0-0-dev libpcsclite-dev libssl-dev pkg-config libpng-dev jq

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Install Python deps
        run: |
          cd apps/api
          pip install -U pip
          pip install poetry
          poetry install --no-dev

      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Node cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            **/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Node deps
        run: |
          pnpm -w install

      - name: DB migrate
        run: |
          # Backend migrations
          cd apps/api
          poetry run alembic upgrade head
          cd ../..
          # Frontend migrations
          pnpm --filter @shomer/web prisma:generate || true

      - name: Lint & Typecheck
        run: |
          # Backend linting
          cd apps/api
          poetry run ruff check . || true
          poetry run mypy || true
          cd ../..
          # Frontend linting
          pnpm --filter @shomer/web lint --max-warnings=0 || true

      - name: Run tests
        run: |
          # Backend tests
          cd apps/api
          poetry run pytest -q --maxfail=1 --disable-warnings
          cd ../..
          # Frontend tests
          pnpm --filter @shomer/web test || echo "no tests"