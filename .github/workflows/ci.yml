name: ci
on:
  push: { branches: ["main"] }
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - run: pnpm -w install
      - run: pnpm -w -r build || true
      - run: pnpm --filter @shomer/web prisma:generate || true
      - run: pnpm --filter @shomer/web lint --max-warnings=0
      - run: pnpm --filter @shomer/web test || echo "no tests"