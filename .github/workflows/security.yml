name: Security Scan

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    name: Security Analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for gitleaks
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install Python dependencies
      run: |
        cd apps/api
        pip install semgrep
        pip install cyclonedx-bom
    
    - name: Install Node.js dependencies
      run: |
        cd apps/web
        npm ci
    
    # SAST with Semgrep
    - name: Run Semgrep SAST
      run: |
        semgrep ci --config p/owasp-top-ten --config p/security-audit --config p/python --config p/javascript --config p/typescript --config semgrep-config.yml --json --output=semgrep-results.json
      continue-on-error: true
    
    - name: Upload Semgrep results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: semgrep-results
        path: semgrep-results.json
    
    # Container scanning with Trivy
    - name: Run Trivy filesystem scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH,MEDIUM'
        config: 'trivy-config.yaml'
      continue-on-error: true
    
    - name: Upload Trivy results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: trivy-results
        path: trivy-results.sarif
    
    # Secret scanning with Gitleaks
    - name: Run Gitleaks secret scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        GITLEAKS_CONFIG_PATH: .gitleaks.toml
      continue-on-error: true
    
    # SBOM generation with CycloneDX
    - name: Generate Python SBOM
      run: |
        cd apps/api
        cyclonedx-py -o sbom-python.json
      continue-on-error: true
    
    - name: Generate Node.js SBOM
      run: |
        cd apps/web
        npx @cyclonedx/cyclonedx-npm --output-file sbom-nodejs.json
      continue-on-error: true
    
    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: sbom-artifacts
        path: |
          apps/api/sbom-python.json
          apps/web/sbom-nodejs.json
    
    # Security summary
    - name: Generate security summary
      run: |
        echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Tools Used:" >> $GITHUB_STEP_SUMMARY
        echo "- **Semgrep**: Static Application Security Testing (SAST)" >> $GITHUB_STEP_SUMMARY
        echo "- **Trivy**: Container and filesystem vulnerability scanning" >> $GITHUB_STEP_SUMMARY
        echo "- **Gitleaks**: Secret detection and prevention" >> $GITHUB_STEP_SUMMARY
        echo "- **CycloneDX**: Software Bill of Materials (SBOM) generation" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Results:" >> $GITHUB_STEP_SUMMARY
        echo "Check the artifacts section for detailed reports." >> $GITHUB_STEP_SUMMARY
    
    # Fail on critical findings
    - name: Check for critical security issues
      run: |
        # Check if Semgrep found critical issues
        if [ -f semgrep-results.json ]; then
          CRITICAL_COUNT=$(jq '.results | length' semgrep-results.json)
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ Semgrep found $CRITICAL_COUNT security issues"
            exit 1
          else
            echo "✅ Semgrep scan passed"
          fi
        fi
        
        # Check if Trivy found critical vulnerabilities
        if [ -f trivy-results.sarif ]; then
          CRITICAL_VULNS=$(jq '.runs[0].results | length' trivy-results.sarif)
          if [ "$CRITICAL_VULNS" -gt 0 ]; then
            echo "❌ Trivy found $CRITICAL_VULNS vulnerabilities"
            exit 1
          else
            echo "✅ Trivy scan passed"
          fi
        fi
      continue-on-error: true