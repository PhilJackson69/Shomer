name: Rotate Secrets

on:
  # Run on 1st of every month at 5:00 AM UTC
  schedule:
    - cron: "0 5 1 * *"
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (do not apply changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write  # Need write permission to commit rotated secrets

jobs:
  rotate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Run secret rotation
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          python apps/api/app/scripts/rotate_secrets.py
      
      - name: Commit rotated secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [[ -f .env.production ]]; then
            git add .env.production
            git commit -m "chore: rotate secrets - $(date +'%Y-%m-%d')" || echo "No changes to commit"
            git push
          else
            echo "No .env.production file found to commit"
          fi
      
      - name: Create rotation summary
        if: always()
        run: |
          echo "## Secret Rotation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dry Run:** ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Keys Rotated:**" >> $GITHUB_STEP_SUMMARY
          echo "- JWT_SECRET" >> $GITHUB_STEP_SUMMARY
          echo "- SIGNED_URL_SECRET" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [[ "${{ github.event.inputs.dry_run }}" != "true" ]]; then
            echo "⚠️ **Action Required:** Update production environment variables" >> $GITHUB_STEP_SUMMARY
          fi

