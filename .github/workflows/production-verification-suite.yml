name: Production Verification Suite

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'scripts/**'
  pull_request:
    branches: [main]
    paths:
      - 'apps/**'
      - 'infra/**'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_deploy:
        description: 'Skip deployment, run verification only'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  security-preflight:
    name: Security Preflight Validation
    runs-on: ubuntu-latest
    outputs:
      preflight-passed: ${{ steps.preflight.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security preflight validation
        id: preflight
        run: |
          chmod +x scripts/preflight-validation.sh
          ./scripts/preflight-validation.sh
          echo "result=success" >> $GITHUB_OUTPUT
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          PROD_URL: ${{ secrets.PROD_URL }}

  code-quality-gates:
    name: Code Quality Gates
    runs-on: ubuntu-latest
    needs: security-preflight
    if: needs.security-preflight.outputs.preflight-passed == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint security rules
        run: |
          pnpm --filter web lint --max-warnings 0
          pnpm --filter shared lint --max-warnings 0

      - name: Run Semgrep security scan
        run: |
          chmod +x scripts/supply_chain_security.sh
          ./scripts/supply_chain_security.sh

      - name: Check for raw fetch usage
        run: |
          chmod +x scripts/check-no-raw-fetch.sh
          ./scripts/check-no-raw-fetch.sh

  dast-security-scan:
    name: DAST Security Scan
    runs-on: ubuntu-latest
    needs: [security-preflight, code-quality-gates]
    if: always() && needs.security-preflight.outputs.preflight-passed == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run DAST baseline scan
        run: |
          chmod +x scripts/dast_baseline_scan.sh
          ./scripts/dast_baseline_scan.sh
        env:
          TARGET_URL: ${{ secrets.STAGING_URL }}

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: [security-preflight, code-quality-gates]
    if: needs.security-preflight.outputs.preflight-passed == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build applications
        run: |
          pnpm --filter shared build
          pnpm --filter web build

      - name: Run tests
        run: pnpm test

      - name: Run Playwright tests
        run: pnpm test:e2e

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [security-preflight, code-quality-gates, build-and-test]
    if: needs.security-preflight.outputs.preflight-passed == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/api:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/web:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [security-preflight, code-quality-gates, build-and-test, docker-build, dast-security-scan]
    if: |
      always() && 
      needs.security-preflight.outputs.preflight-passed == 'success' &&
      needs.code-quality-gates.result == 'success' &&
      needs.build-and-test.result == 'success' &&
      needs.docker-build.result == 'success' &&
      (needs.dast-security-scan.result == 'success' || needs.dast-security-scan.result == 'skipped')
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          chmod +x scripts/quick-deploy.sh
          ./scripts/quick-deploy.sh staging
        env:
          DOCKER_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          STAGING_URL: ${{ secrets.STAGING_URL }}

  post-deploy-verification:
    name: Post-Deploy Verification
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run complete verification flow
        run: |
          chmod +x scripts/complete-verification-flow.sh
          ./scripts/complete-verification-flow.sh
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

      - name: Run post-deploy verification
        run: |
          chmod +x scripts/post-deploy-verification.sh
          ./scripts/post-deploy-verification.sh
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}

      - name: Generate verification report
        run: |
          echo "# Verification Report - $(date)" > verification-report.md
          echo "## Security Preflight: ✅ PASSED" >> verification-report.md
          echo "## Code Quality Gates: ✅ PASSED" >> verification-report.md
          echo "## DAST Security Scan: ✅ PASSED" >> verification-report.md
          echo "## Build and Test: ✅ PASSED" >> verification-report.md
          echo "## Docker Build: ✅ PASSED" >> verification-report.md
          echo "## Deployment: ✅ PASSED" >> verification-report.md
          echo "## Post-Deploy Verification: ✅ PASSED" >> verification-report.md
          echo "" >> verification-report.md
          echo "**Commit:** ${{ github.sha }}" >> verification-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> verification-report.md
          echo "**Timestamp:** $(date -u)" >> verification-report.md

      - name: Upload verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report-${{ github.sha }}
          path: verification-report.md
          retention-days: 30

  production-deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, post-deploy-verification]
    if: |
      github.ref == 'refs/heads/main' &&
      needs.deploy-staging.result == 'success' &&
      needs.post-deploy-verification.result == 'success' &&
      (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security drill
        run: |
          chmod +x scripts/security-drill.sh
          ./scripts/security-drill.sh
        env:
          PROD_URL: ${{ secrets.PROD_URL }}

      - name: Deploy to production
        run: |
          chmod +x scripts/quick-deploy.sh
          ./scripts/quick-deploy.sh production
        env:
          DOCKER_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          PROD_URL: ${{ secrets.PROD_URL }}

      - name: Run production verification
        run: |
          chmod +x scripts/complete-verification-flow.sh
          ./scripts/complete-verification-flow.sh
        env:
          PROD_URL: ${{ secrets.PROD_URL }}

      - name: Generate production report
        run: |
          echo "# Production Deployment Report - $(date)" > production-report.md
          echo "## Deployment Status: ✅ SUCCESS" >> production-report.md
          echo "## Security Drill: ✅ PASSED" >> production-report.md
          echo "## Production Verification: ✅ PASSED" >> production-report.md
          echo "" >> production-report.md
          echo "**Commit:** ${{ github.sha }}" >> production-report.md
          echo "**Timestamp:** $(date -u)" >> production-report.md

      - name: Upload production report
        uses: actions/upload-artifact@v4
        with:
          name: production-report-${{ github.sha }}
          path: production-report.md
          retention-days: 90

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [production-deploy, post-deploy-verification]
    if: always()
    steps:
      - name: Notify success
        if: needs.production-deploy.result == 'success'
        run: |
          echo "🚀 Production deployment completed successfully!"
          echo "Verification suite passed all checks."

      - name: Notify failure
        if: needs.production-deploy.result == 'failure' || needs.post-deploy-verification.result == 'failure'
        run: |
          echo "❌ Deployment or verification failed!"
          echo "Check the workflow logs for details."
          exit 1
