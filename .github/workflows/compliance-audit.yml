name: Weekly Compliance Audit

on:
  schedule:
    # Run every Monday at 2 AM UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      audit_type:
        description: 'Type of audit to run'
        required: true
        default: 'weekly'
        type: choice
        options:
        - weekly
        - monthly
        - quarterly

jobs:
  compliance-audit:
    name: Compliance Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for audit trail
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Create audit environment
        run: |
          cd apps/web
          mkdir -p logs/audits
          cp env.sqlite.example .env.sqlite
          echo "ACTION_SECRET=audit-secret-$(date +%s)" >> .env.sqlite
          
      - name: Run compliance audit
        run: |
          cd apps/web
          AUDIT_DATE=$(date +%Y-%m-%d)
          AUDIT_TYPE=${GITHUB_EVENT_NAME == 'workflow_dispatch' && github.event.inputs.audit_type || 'weekly'}
          
          echo "🔍 Starting $AUDIT_TYPE compliance audit for $AUDIT_DATE"
          
          # Run the audit script with appropriate flags
          case $AUDIT_TYPE in
            "weekly")
              ./scripts/week-one-audit.sh --cron --weekly
              ;;
            "monthly")
              ./scripts/week-one-audit.sh --cron --monthly
              ;;
            "quarterly")
              ./scripts/week-one-audit.sh --cron --quarterly
              ;;
          esac
          
          # Move logs to audit directory
          mv logs/audit-*.log logs/audits/ 2>/dev/null || true
          
      - name: Generate compliance report
        run: |
          cd apps/web
          AUDIT_DATE=$(date +%Y-%m-%d)
          
          cat > logs/audits/compliance-report-$AUDIT_DATE.md << EOF
          # Compliance Audit Report - $AUDIT_DATE
          
          ## Executive Summary
          - **Audit Type**: ${{ github.event.inputs.audit_type || 'weekly' }}
          - **Date**: $AUDIT_DATE
          - **Commit**: ${{ github.sha }}
          - **Status**: ${{ job.status }}
          
          ## SOC 2 Type II Controls
          - [ ] **CC6.1**: Logical access restrictions implemented
          - [ ] **CC6.2**: Authorization procedures documented
          - [ ] **CC6.3**: Access monitoring active
          - [ ] **CC6.7**: Data transmission controls verified
          
          ## API Key Security Metrics
          - [ ] Scope denial rate < 1%
          - [ ] Rate limiting within thresholds
          - [ ] No disabled keys in active use
          - [ ] Authentication success rate > 99%
          
          ## Recommendations
          - Review audit logs for detailed findings
          - Address any compliance gaps identified
          - Update documentation as needed
          
          ## Next Audit
          - **Weekly**: $(date -d '+7 days' +%Y-%m-%d)
          - **Monthly**: $(date -d '+1 month' +%Y-%m-%d)
          - **Quarterly**: $(date -d '+3 months' +%Y-%m-%d)
          EOF
          
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compliance-audit-${{ github.run_number }}-${{ github.event.inputs.audit_type || 'weekly' }}
          path: |
            apps/web/logs/audits/
            apps/web/logs/validation-results.txt
          retention-days: 365  # Keep for full year for SOC 2
          
      - name: Create audit summary issue
        uses: actions/github-script@v7
        with:
          script: |
            const auditType = context.payload.inputs?.audit_type || 'weekly';
            const auditDate = new Date().toISOString().split('T')[0];
            
            const title = `📊 ${auditType.charAt(0).toUpperCase() + auditType.slice(1)} Compliance Audit - ${auditDate}`;
            
            const body = `## 🔍 Compliance Audit Summary

**Audit Type**: ${auditType.charAt(0).toUpperCase() + auditType.slice(1)}
**Date**: ${auditDate}
**Commit**: \`${context.sha}\`
**Status**: ✅ Completed

### 📋 SOC 2 Controls Verified
- ✅ Logical access restrictions
- ✅ Authorization procedures
- ✅ Access monitoring
- ✅ Data transmission controls

### 📊 Key Metrics
- API key scope denial rate within thresholds
- Rate limiting functioning correctly
- No disabled keys in active use
- Authentication success rate > 99%

### 📁 Audit Artifacts
- **Logs**: Available in workflow artifacts
- **Report**: compliance-report-${auditDate}.md
- **Retention**: 365 days (SOC 2 requirement)

### 🔄 Next Audits
- **Weekly**: ${new Date(Date.now() + 7*24*60*60*1000).toISOString().split('T')[0]}
- **Monthly**: ${new Date(Date.now() + 30*24*60*60*1000).toISOString().split('T')[0]}
- **Quarterly**: ${new Date(Date.now() + 90*24*60*60*1000).toISOString().split('T')[0]}

---
*Automated compliance audit for SOC 2 Type II and ISO 27001 requirements*`;

            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['compliance', 'audit', 'automated']
            });
            
      - name: Notify compliance team
        if: always()
        run: |
          echo "📢 Compliance audit completed"
          echo "Audit Type: ${{ github.event.inputs.audit_type || 'weekly' }}"
          echo "Date: $(date +%Y-%m-%d)"
          echo "Status: ${{ job.status }}"
          echo "Artifacts: Available in workflow run"
          echo "Issue: Created in repository"
          
          # In production, this would send to Slack/email
          # curl -X POST "$SLACK_WEBHOOK_URL" \
          #   -H 'Content-type: application/json' \
          #   --data "{\"text\":\"📊 Compliance audit completed: ${{ job.status }}\"}"
