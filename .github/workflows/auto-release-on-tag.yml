name: Auto Release on Tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Build/prepare your real artifacts here (add steps as needed)
      - name: Prepare artifacts
        run: |
          mkdir -p releases/artifacts
          # Example placeholder; replace with real build steps
          echo "hello" > releases/artifacts/hello.txt

      - name: Create GitHub Release + Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            releases/artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
