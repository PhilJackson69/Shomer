# OpenAPI additions for API Keys hardening
# Paste these into your existing OpenAPI spec

paths:
  /api/orgs/{orgId}/api-keys:
    get:
      summary: List organization API keys
      security:
        - OrgApiKey: []
        - ActionSecret: []
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of API keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    
    post:
      summary: Create organization API key
      security:
        - OrgApiKey: []
        - ActionSecret: []
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                label:
                  type: string
                  maxLength: 80
                  description: Human-readable label for the key
                scopes:
                  type: array
                  items:
                    type: string
                    enum: 
                      - rota.write
                      - copy.week
                      - seed.week
                      - settings.write
                      - share.rotate
                      - webhook.manage
                      - swap.approve
                      - swap.decline
                  description: List of scopes to grant. Empty array = full access
                requestsPerMinute:
                  type: integer
                  minimum: 1
                  description: Rate limit in requests per minute. Null = unlimited
                expiresAt:
                  type: string
                  format: date-time
                  description: Optional expiration date
      responses:
        "201":
          description: API key created (value returned once)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  key:
                    allOf:
                      - $ref: "#/components/schemas/ApiKey"
                      - type: object
                        properties:
                          value:
                            type: string
                            description: The API key value (only returned once)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    
    delete:
      summary: Revoke organization API key
      security:
        - OrgApiKey: []
        - ActionSecret: []
      parameters:
        - in: path
          name: orgId
          required: true
          schema:
            type: string
        - in: query
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/oncall/rota/copy-week:
    post:
      summary: Copy a week of rota schedule
      security:
        - OrgApiKey: []
        - ActionSecret: []
      parameters:
        - in: query
          name: orgId
          required: true
          schema:
            type: string
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
          description: Start date for copying (YYYY-MM-DD)
        - in: query
          name: weeks
          required: true
          schema:
            type: integer
            minimum: 1
          description: Number of weeks to copy
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                weeks:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Week copied successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    OrgApiKey:
      type: apiKey
      in: header
      name: X-Org-Api-Key
      description: Organization API key with scoped permissions
    ActionSecret:
      type: apiKey
      in: header
      name: X-Action-Secret
      description: Global action secret (bypasses scopes and rate limits)

  schemas:
    ApiKey:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the API key
        label:
          type: string
          nullable: true
          description: Human-readable label
        prefix:
          type: string
          description: Display prefix (e.g., "org_abc_1234")
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        revokedAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        scopes:
          type: array
          items:
            type: string
          nullable: true
          description: List of granted scopes. Null = full access
        requestsPerMinute:
          type: integer
          nullable: true
          description: Rate limit in requests per minute. Null = unlimited

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Error code
            message:
              type: string
              description: Human-readable error message
            details:
              type: object
              description: Additional error context
      required:
        - error

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            invalid_scope:
              summary: Invalid scope provided
              value:
                error:
                  code: "validation_error"
                  message: "Invalid scope provided"
                  details:
                    field: "scopes"
                    value: ["invalid.scope"]

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missing_key:
              summary: Missing API key
              value:
                error:
                  code: "invalid_key"
                  message: "Missing API key"
            invalid_key:
              summary: Invalid API key
              value:
                error:
                  code: "invalid_key"
                  message: "Invalid API key"
            disabled_key:
              summary: API key disabled
              value:
                error:
                  code: "invalid_key"
                  message: "API key disabled"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            forbidden_scope:
              summary: Insufficient scope
              value:
                error:
                  code: "forbidden_scope"
                  message: "Requires scope settings.write"
                  details:
                    required: "settings.write"
                    available: ["rota.write", "copy.week"]

    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            rate_limited:
              summary: Rate limit exceeded
              value:
                error:
                  code: "rate_limited"
                  message: "Rate limit exceeded"
                  details:
                    retryAfter: 60

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            key_not_found:
              summary: API key not found
              value:
                error:
                  code: "not_found"
                  message: "API key not found"
