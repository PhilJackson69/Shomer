version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: shomer-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shomer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shomer}
      POSTGRES_DB: ${POSTGRES_DB:-shomer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shomer"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: shomer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: shomer-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shomer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shomer}
      POSTGRES_DB: ${POSTGRES_DB:-shomer}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://shomer:shomer@db:5432/shomer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_SECRET_KEY: ${API_SECRET_KEY:-devsecret_change_me}
      JWT_SECRET: ${JWT_SECRET:-devjwt_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    env_file:
      - ./apps/web/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/shomer
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  pgdata:

