version: '3.8'

# Production Docker Compose Configuration for Shomer
#
# Features:
# - HTTPS/TLS with nginx reverse proxy
# - PostgreSQL with persistent volumes
# - Redis for caching and rate limiting
# - Health checks for all services
# - Resource limits
# - Restart policies
#
# Usage:
#   docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   1. Set environment variables (see .env.production)
#   2. Place TLS certificates in infra/nginx/certs/
#   3. Build images: docker-compose -f docker-compose.prod.yml build

services:
  # ============================================================================
  # Nginx Reverse Proxy
  # ============================================================================
  proxy:
    image: nginx:1.25-alpine
    container_name: shomer-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
      - ./infra/nginx/www:/var/www:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      - api
      - web
    networks:
      - shomer-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ============================================================================
  # FastAPI Backend
  # ============================================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-unknown}
    container_name: shomer-api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - STORAGE_LOCAL_PATH=/app/uploads
      - FEATURE_EVIDENCE=true
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - GIT_SHA=${GIT_SHA:-unknown}
      - WEB_ORIGIN=https://${DOMAIN:-shomer.app}
    volumes:
      - evidence-storage:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - shomer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # Next.js Frontend
  # ============================================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN:-shomer.app}/api/v1
    container_name: shomer-web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-shomer.app}/api/v1
    networks:
      - shomer-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # ============================================================================
  # PostgreSQL Database
  # ============================================================================
  db:
    image: postgres:16-alpine
    container_name: shomer-db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - shomer-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=1GB"
      - "-c"
      - "maintenance_work_mem=128MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
      - "-c"
      - "work_mem=1MB"
      - "-c"
      - "min_wal_size=1GB"
      - "-c"
      - "max_wal_size=4GB"

  # ============================================================================
  # Redis Cache & Rate Limiting
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: shomer-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-shomer}
    volumes:
      - redis-data:/data
    networks:
      - shomer-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # Database Backup (runs daily)
  # ============================================================================
  backup:
    image: postgres:16-alpine
    container_name: shomer-backup
    restart: "no"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./backups:/backups
      - ./apps/api/scripts:/scripts:ro
    networks:
      - shomer-network
    depends_on:
      - db
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Running backup..."
        pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB > /backups/backup-$$(date +%Y%m%d-%H%M%S).sql
        echo "Backup completed"
        # Keep only last 7 days of backups
        find /backups -name "backup-*.sql" -mtime +7 -delete

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  evidence-storage:
    driver: local
  nginx-logs:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  shomer-network:
    driver: bridge

