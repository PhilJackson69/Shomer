version: '3.8'

# Observability Stack for Shomer
# Includes Prometheus, Grafana, and Jaeger for metrics, dashboards, and tracing
#
# Usage:
#   docker compose -f docker-compose.observability.yml up -d
#
# Access:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000 (admin/admin)
#   Jaeger:     http://localhost:16686

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: shomer-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    container_name: shomer-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=
    volumes:
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - observability

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: shomer-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
      - "14250:14250"  # Jaeger gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    restart: unless-stopped
    networks:
      - observability

  # Optional: Loki for log aggregation
  # loki:
  #   image: grafana/loki:latest
  #   container_name: shomer-loki
  #   ports:
  #     - "3100:3100"
  #   volumes:
  #     - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
  #     - loki-data:/loki
  #   command: -config.file=/etc/loki/loki-config.yml
  #   restart: unless-stopped
  #   networks:
  #     - observability

  # Optional: Promtail for log shipping to Loki
  # promtail:
  #   image: grafana/promtail:latest
  #   container_name: shomer-promtail
  #   volumes:
  #     - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
  #     - /var/log:/var/log:ro
  #   command: -config.file=/etc/promtail/promtail-config.yml
  #   depends_on:
  #     - loki
  #   restart: unless-stopped
  #   networks:
  #     - observability

volumes:
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  jaeger-data:
    driver: local
  # loki-data:
  #   driver: local

networks:
  observability:
    driver: bridge
    name: shomer-observability

