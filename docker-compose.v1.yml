version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: shomer-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shomer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shomer}
      POSTGRES_DB: ${POSTGRES_DB:-shomer}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shomer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: shomer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NLP Service
  nlp:
    build:
      context: ./services/nlp
      dockerfile: Dockerfile
    container_name: shomer-nlp
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  # FastAPI Backend
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: shomer-api
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shomer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shomer}
      POSTGRES_DB: ${POSTGRES_DB:-shomer}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://shomer:shomer@db:5432/shomer}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      API_HOST: ${API_HOST:-0.0.0.0}
      API_PORT: ${API_PORT:-8000}
      API_SECRET_KEY: ${API_SECRET_KEY:-devsecret_change_me}
      JWT_SECRET: ${JWT_SECRET:-devjwt_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-3600}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      REDDIT_USER_AGENT: ${REDDIT_USER_AGENT:-ShomerBot/1.0}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      MAPBOX_ACCESS_TOKEN: ${MAPBOX_ACCESS_TOKEN:-}
      NLP_SERVICE_URL: ${NLP_SERVICE_URL:-http://nlp:8001}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nlp:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: shomer-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${NEXT_PUBLIC_MAPBOX_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:


